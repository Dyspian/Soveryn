services:
  db:
    image: postgis/postgis:16-3.5
    environment:
      POSTGRES_USER: soveryn
      POSTGRES_PASSWORD: soveryn
      POSTGRES_DB: soveryn
    ports:
      - "5432:5432"
    volumes:
      - soveryn_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U soveryn -d soveryn"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  soveryn_pg:
